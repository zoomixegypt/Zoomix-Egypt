<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>ZOOMIX — الصفحة مش هنا</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      body { margin: 0; background: #0A0A0A; color: #F5F4EF; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(720px, calc(100% - 48px)); padding: 32px 0; }
      .eyebrow { color: #BBFF00; font: 11px monospace; letter-spacing: .18em; }
      h1 { font-size: clamp(3rem, 10vw, 7rem); line-height: .9; margin: 24px 0 0; color: #BBFF00; }
      p { max-width: 560px; color: rgba(245,244,239,.68); font-size: clamp(1.05rem, 2vw, 1.5rem); line-height: 1.8; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
      a { display: inline-block; padding: 14px 20px; text-decoration: none; font-weight: 700; }
      .primary { color: #0A0A0A; background: #BBFF00; }
      .secondary { color: #F5F4EF; border: 1px solid rgba(245,244,239,.3); }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">ZOOMIX / 404</div>
      <h1>الصفحة مش هنا.</h1>
      <p>ضعت؟ خلينا نرتبها سوا ونوصلك للمسار الصح.</p>
      <div class="actions">
        <a class="primary" href="/route-finder">ابدأ الاختيار السريع ↗</a>
        <a class="secondary" href="/">العودة للموقع</a>
      </div>
    </main>
  </body>
</html>
